<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imperdonables Mobile Pro</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
:root{--bg:#020617;--card:#0f172acc;--line:#1e293b;--txt:#f8fafc;--muted:#94a3b8;--blue:#6366f1;--ok:#10b981;--warn:#f59e0b;--bad:#f43f5e;}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#020617,#0f172a);color:var(--txt);overflow:hidden}
button,select,input{font-family:inherit} .app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px;gap:10px}
.card{background:rgba(15,23,42,.72);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 50px #0005}
.header{display:flex;align-items:center;gap:12px;margin-bottom:16px} .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);display:flex;align-items:center;justify-content:center;font-weight:900}
.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#64748b;font-weight:900} h1,h2,h3{margin:0} h1{font-size:22px} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:rgba(2,6,23,.45);border:1px solid var(--line);border-radius:16px;padding:14px} .kpi .label{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.12em;font-weight:900} .kpi .value{font-size:22px;font-weight:900;margin-top:6px}
.kpi.obj{background:#4f46e51a;border-color:#6366f155} .kpi.ok{background:#10b98122;border-color:#10b98199;color:#d1fae5} .kpi.warn{background:#f59e0b22;border-color:#f59e0b99;color:#fef3c7} .kpi.bad{background:#f43f5e22;border-color:#f43f5e99;color:#ffe4e6}
.section-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#64748b;font-weight:900;margin-bottom:14px}
label{font-size:10px;font-weight:900;color:#818cf8;text-transform:uppercase;letter-spacing:.16em;margin:12px 0 8px;display:block}
select,input{width:100%;height:46px;background:rgba(30,41,59,.65);border:1px solid #334155;border-radius:14px;color:#fff;padding:0 12px;font-size:14px;outline:none}
select:focus,input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f133}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px} button{height:46px;border:0;border-radius:14px;font-weight:900;color:#fff;background:linear-gradient(135deg,#4f46e5,#2563eb);cursor:pointer} button.secondary{background:#1e293b} button.back{width:auto;padding:0 16px;background:#1e293b} button:disabled{opacity:.5;cursor:not-allowed}
.help{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#64748b;min-height:0} .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:rgba(15,23,42,.86);border:1px solid var(--line);border-radius:18px;margin-bottom:10px}
.scroll{overflow:auto;min-height:0;flex:1;padding-bottom:10px} .row{background:rgba(15,23,42,.70);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}
.row:hover{border-color:#6366f1} .client-title{font-size:15px;font-weight:900;line-height:1.25} .meta{font-size:11px;color:#94a3b8;margin-top:5px} .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px} .tag{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#1e293b;color:#cbd5e1} .tag.ok{background:#10b981;color:#052e16} .tag.warn{background:#f59e0b;color:#1c1917} .tag.bad{background:#f43f5e;color:white} .tag.audit{background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b55}
.bar{height:7px;background:#1e293b;border-radius:999px;overflow:hidden;margin-top:12px} .bar>div{height:100%;border-radius:999px} .bg-ok{background:var(--ok)} .bg-warn{background:var(--warn)} .bg-bad{background:var(--bad)}
.detail-main{position:relative} .audit-corner{position:absolute;right:18px;top:18px} .big{font-size:24px;font-weight:900;margin-top:6px;line-height:1.15} .split{display:flex;justify-content:space-between;gap:12px;background:#02061780;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px} .smalllabel{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.12em;font-weight:900} .bigvalue{font-size:20px;font-weight:900;margin-top:5px}
.info{font-size:12px;color:#cbd5e1;background:#1e293b55;border:1px solid #334155;border-radius:16px;padding:12px;margin-top:12px;line-height:1.55} .triple{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:#02061780;border:1px solid var(--line);border-radius:16px;margin-top:16px;overflow:hidden} .triple>div{padding:14px;text-align:center;border-left:1px solid var(--line)} .triple>div:first-child{border-left:0}
.imp{display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid;padding:14px;margin-bottom:10px} .imp.ok{background:#10b98110;border-color:#10b98155} .imp.no{background:#f43f5e10;border-color:#f43f5e55} .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto} .hidden{display:none!important} .error{position:fixed;left:10px;right:10px;top:10px;z-index:99;background:#f43f5e;color:white;border-radius:16px;padding:14px;font-weight:900;box-shadow:0 20px 60px #0009} .muted{color:#64748b} .search{margin:0 0 10px}
</style>
</head>
<body>
<div id="error" class="error hidden"></div>
<main class="app">
  <section id="viewFilters" class="scroll"></section>
  <section id="viewResults" class="hidden" style="height:100%;display:flex;flex-direction:column"></section>
  <section id="viewDetail" class="hidden" style="height:100%;display:flex;flex-direction:column"></section>
</main>
<script>
const CONFIG = {
  sheets: [
    { segmento: 'AUTOSERVICIO', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTJYwdbpcF8pL1OkOQc2ESZHPkIvNN6IRoCabAiE3GGKFoFNVH0_Rpfqsj8bxnyw/pub?gid=1897406888&single=true&output=csv' },
    { segmento: 'ORO', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTJYwdbpcF8pL1OkOQc2ESZHPkIvNN6IRoCabAiE3GGKFoFNVH0_Rpfqsj8bxnyw/pub?gid=1674759979&single=true&output=csv' },
    { segmento: 'PLATA', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTJYwdbpcF8pL1OkOQc2ESZHPkIvNN6IRoCabAiE3GGKFoFNVH0_Rpfqsj8bxnyw/pub?gid=2007565552&single=true&output=csv' },
    { segmento: 'KIOSCO', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTJYwdbpcF8pL1OkOQc2ESZHPkIvNN6IRoCabAiE3GGKFoFNVH0_Rpfqsj8bxnyw/pub?gid=1866612683&single=true&output=csv' },
    { segmento: 'BRONCE', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTJYwdbpcF8pL1OkOQc2ESZHPkIvNN6IRoCabAiE3GGKFoFNVH0_Rpfqsj8bxnyw/pub?gid=1006300389&single=true&output=csv' }
  ],
  auditablesUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTJYwdbpcF8pL1OkOQc2ESZHPkIvNN6IRoCabAiE3GGKFoFNVH0_Rpfqsj8bxnyw/pub?gid=1179124923&single=true&output=csv',
  iceUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRTJYwdbpcF8pL1OkOQc2ESZHPkIvNN6IRoCabAiE3GGKFoFNVH0_Rpfqsj8bxnyw/pub?gid=125032811&single=true&output=csv',
  objetivosSegmento: { AUTOSERVICIO:75.00, ORO:74.44, PLATA:73.00, KIOSCO:40.08, BRONCE:43.59 },
  iceByOutnum: {},
  auditableOutnums: [],
  headerAliases: {}
};

let DATA = [];
let AUDITABLE_SET = new Set(CONFIG.auditableOutnums || []);
let ICE_MAP = {...(CONFIG.iceByOutnum || {})};
let FILTERS = {segmento:'TODOS', jefe:'TODOS', ruta:'TODOS', auditables:'TODOS'};
let SELECTED = null;

const $ = (id)=>document.getElementById(id);
function esc(v){return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function norm(v){return String(v ?? '').trim();}
function upper(v){return norm(v).toUpperCase();}
function pct(n,d){return !d||d<=0?0:(n/d)*100;}
function formatPct(v){let n=Number(v); if(Number.isNaN(n)) return '0,0%'; return n.toFixed(1).replace('.', ',')+'%';}
function uniq(arr){return [...new Set(arr.filter(x=>norm(x)))];}
function clsByObj(segmento, porcentaje){const obj=CONFIG.objetivosSegmento[segmento]||0; const diff=obj-porcentaje; if(porcentaje>=obj)return 'ok'; if(diff<=5)return 'warn'; return 'bad';}
function barByObj(segmento, porcentaje){return 'bg-'+clsByObj(segmento, porcentaje);}
function iceClass(ice){if(ice===null||Number.isNaN(ice))return ''; if(ice>=80)return 'ok'; if(ice>=60)return 'warn'; return 'bad';}
function showError(msg){const e=$('error'); e.textContent=msg; e.classList.remove('hidden'); setTimeout(()=>e.classList.add('hidden'),5000);}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows=[]; let row=[]; let cur=''; let q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(q){ if(c==='"' && n==='"'){cur+='"'; i++;} else if(c==='"') q=false; else cur+=c; }
    else { if(c==='"') q=true; else if(c===','){row.push(cur); cur='';} else if(c==='\n'){row.push(cur); if(row.some(x=>norm(x) !== '')) rows.push(row); row=[]; cur='';} else if(c==='\r'){} else cur+=c; }
  }
  row.push(cur); if(row.some(x=>norm(x) !== '')) rows.push(row);
  return rows;
}
async function fetchCSV(url){
  const res=await fetch(url + (url.includes('?')?'&':'?') + '_ts=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('No se pudo leer CSV');
  return parseCSV(await res.text());
}
async function loadAuditablesCSV(){
  if(!CONFIG.auditablesUrl) return new Set(CONFIG.auditableOutnums || []);
  const rows = await fetchCSV(CONFIG.auditablesUrl);
  const codes = rows.map(r => norm(r[0]).replace(/\D/g,'')).filter(code => /^\d{6,}$/.test(code));
  return new Set(codes);
}
function parseIceNumber(v){let s=norm(v).replace('%','').replace(/\./g,'').replace(',', '.'); const n=Number(s); return Number.isNaN(n)?null:n;}
async function loadIceCSV(){
  const map = {...(CONFIG.iceByOutnum || {})};
  if(!CONFIG.iceUrl) return map;
  const rows = await fetchCSV(CONFIG.iceUrl);
  if(!rows.length) return map;
  let headerIndex = rows.findIndex((r,idx)=>idx<=8 && r.some(v=>upper(v)==='OUT-CL' || upper(v).includes('OUT')) && r.some(v=>upper(v).includes('PUNTAJE') || upper(v).includes('AVANCE') || upper(v).includes('ICE')));
  if(headerIndex === -1) headerIndex = rows.findIndex((r,idx)=>idx<=8 && r.some(v=>upper(v)==='OUT-CL' || upper(v).includes('OUT')));
  const header = headerIndex >= 0 ? rows[headerIndex] : [];
  const dataRows = headerIndex >= 0 ? rows.slice(headerIndex+1) : rows;
  let clienteIdx = header.findIndex(v=>upper(v)==='OUT-CL' || upper(v).includes('OUT'));
  let avanceIdx = header.findIndex(v=>upper(v).includes('PUNTAJE') || upper(v).includes('AVANCE') || upper(v).includes('ICE'));
  if(clienteIdx === -1) clienteIdx = 4;
  if(avanceIdx === -1) avanceIdx = 5;
  for(const row of dataRows){
    const clienteRaw = norm(row[clienteIdx]), avanceRaw = norm(row[avanceIdx]);
    if(!clienteRaw || !avanceRaw) continue;
    if(upper(clienteRaw).includes('TOTAL')) continue;
    const outnum = clienteRaw.split(' - ')[0].replace(/\D/g,'');
    if(!/^\d{6,}$/.test(outnum)) continue;
    const avance = parseIceNumber(avanceRaw);
    if(avance === null) continue;
    map[outnum] = avance;
  }
  return map;
}
function isBiBooleanValue(v){return ['0','0.0','1','1.0','SI','NO','OK','CUMPLIDO'].includes(upper(v));}
function isDoneValue(v){return ['1','1.0','SI','OK','CUMPLIDO'].includes(upper(v));}
function findColumnIndex(a,b,target){const t=upper(target); for(let i=0;i<Math.max(a.length,b.length);i++){if(upper(a[i])===t||upper(b[i])===t)return i;} return -1;}
function getImpName(top,bottom,i){return [norm(top[i]||''), norm(bottom[i]||'')].filter(Boolean).join(' ').trim() || 'Imperdonable '+(i+1);}

function buildClientRecords(rows, segmento){
  if(!rows.length || rows.length<2) return [];
  const row1=rows[0]||[];
  let metaHeaderIndex = rows.findIndex((r,idx)=>idx<=5 && r.some(v=>upper(v)==='OUT-CL'));
  if(metaHeaderIndex===-1) metaHeaderIndex = rows.findIndex((r,idx)=>idx<=5 && r.some(v=>upper(v).includes('OUT')));
  if(metaHeaderIndex===-1) return [];
  const meta=rows[metaHeaderIndex]||[], dataRows=rows.slice(metaHeaderIndex+1);
  const detalleIdx=meta.findIndex(v=>upper(v)==='DETALLE'), territorioIdx=meta.findIndex(v=>upper(v)==='TERRITORIO'), cediIdx=meta.findIndex(v=>upper(v)==='CEDI'), jefeIdx=meta.findIndex(v=>upper(v)==='JEFE'), rutaIdx=meta.findIndex(v=>upper(v)==='RUTA'), outclIdx=meta.findIndex(v=>upper(v)==='OUT-CL'||upper(v).includes('OUT'));
  if(outclIdx===-1) return [];
  const totalIdx=findColumnIndex(row1,meta,'Total'), dynamicStart=outclIdx+1, dynamicEnd= totalIdx>-1 ? totalIdx : Math.max(row1.length,meta.length);

  // CORRECCIÓN BI: el denominador debe ser fijo por segmento/tabla.
  // Antes se contaban solo las celdas con 0/1 en cada cliente; cuando había blancos,
  // el porcentaje del cliente cambiaba y no coincidía con Power BI.
  // Ahora se toman todas las columnas de imperdonables y los blancos cuentan como pendiente.
  const impColumns=[];
  for(let i=dynamicStart;i<dynamicEnd;i++){
    const top=norm(row1[i]||''), bottom=norm(meta[i]||'');
    const name=getImpName(row1,meta,i);
    if(!top && !bottom) continue;
    if(upper(name).includes('TOTAL')) continue;
    impColumns.push({idx:i,nombre:name});
  }

  let lastDetalle='', lastTerritorio='', lastCedi='', lastJefe='', lastRuta='';
  const clients=[];
  for(const row of dataRows){
    const outcl=norm(row[outclIdx]); if(!outcl) continue;
    lastDetalle=(detalleIdx>-1?norm(row[detalleIdx]):'')||lastDetalle;
    lastTerritorio=(territorioIdx>-1?norm(row[territorioIdx]):'')||lastTerritorio;
    lastCedi=(cediIdx>-1?norm(row[cediIdx]):'')||lastCedi;
    lastJefe=(jefeIdx>-1?norm(row[jefeIdx]):'')||lastJefe;
    lastRuta=(rutaIdx>-1?norm(row[rutaIdx]):'')||lastRuta;
    const parts=outcl.split(' - '), outnum=norm(parts[0]), cliente=norm(parts.slice(1).join(' - '))||outcl;
    const imperdonables=[]; let cumplidos=0;
    for(const col of impColumns){
      const rawVal=norm(row[col.idx]);
      const done=isDoneValue(rawVal);
      if(done) cumplidos++;
      imperdonables.push({nombre:col.nombre, cumplido:done, rawVal:rawVal || '0'});
    }
    const totalValidos=impColumns.length;
    const iceRaw=ICE_MAP[outnum], ice=iceRaw!==undefined&&iceRaw!==null&&iceRaw!==''?Number(iceRaw):null;
    clients.push({key:`${segmento}|${lastCedi}|${lastRuta}|${outnum}|${cliente}`,segmento,outnum,cliente,ruta:lastRuta,jefe:lastJefe,detalle:lastDetalle,territorio:lastTerritorio,cedi:lastCedi,totalImperdonables:totalValidos,cumplidos,porcentaje:pct(cumplidos,totalValidos),ice,auditable:AUDITABLE_SET.has(outnum),imperdonables});
  }
  return clients;
}
async function loadAllData(){
  try{const auditablesDesdeSheet=await loadAuditablesCSV(); if(auditablesDesdeSheet.size>0) AUDITABLE_SET=auditablesDesdeSheet;}catch(e){console.error('AUDITABLES', e); AUDITABLE_SET=new Set(CONFIG.auditableOutnums||[]); showError('No se pudo leer AUDITABLES. Se usa respaldo interno.');}
  try{ICE_MAP=await loadIceCSV();}catch(e){console.error('ICE', e); ICE_MAP={...(CONFIG.iceByOutnum||{})}; showError('No se pudo leer ICE. Se usa respaldo interno.');}
  const results=await Promise.all(CONFIG.sheets.map(async sh=>{try{return buildClientRecords(await fetchCSV(sh.url), sh.segmento);}catch(e){console.error(sh.segmento,e);return [];}}));
  DATA=results.flat();
}

function filteredData(){return DATA.filter(d=>
  (FILTERS.segmento==='TODOS'||d.segmento===FILTERS.segmento) &&
  (FILTERS.jefe==='TODOS'||d.jefe===FILTERS.jefe) &&
  (FILTERS.ruta==='TODOS'||d.ruta===FILTERS.ruta) &&
  (FILTERS.auditables==='TODOS'||d.auditable)
);}
function stats(){
  const f = filteredData();
  const tc = f.length;

  // Cálculo automático: suma todos los 1 cumplidos y divide por el total
  // de imperdonables aplicables. Se recalcula cada vez que cambian
  // segmento, jefe, ruta o auditable.
  const ok = f.reduce((s,d)=>s + Number(d.cumplidos || 0), 0);
  const tot = f.reduce((s,d)=>s + Number(d.totalImperdonables || 0), 0);
  const avance = pct(ok, tot);

  return {
    totalClientes: tc,
    totalCumplidos: ok,
    totalAuditables: f.filter(d=>d.auditable).length,
    avance: avance,
    objetivo: FILTERS.segmento === 'TODOS' ? null : CONFIG.objetivosSegmento[FILTERS.segmento]
  };
}

function renderFilters(isLoading=false){
  showView('viewFilters');
  const s=stats();
  const segs=['TODOS',...uniq(DATA.map(d=>d.segmento)).sort()];
  const jefes=['TODOS',...uniq(DATA.filter(d=>FILTERS.segmento==='TODOS'||d.segmento===FILTERS.segmento).map(d=>d.jefe)).sort()];
  const rutas=['TODOS',...uniq(DATA.filter(d=>(FILTERS.segmento==='TODOS'||d.segmento===FILTERS.segmento)&&(FILTERS.jefe==='TODOS'||d.jefe===FILTERS.jefe)).map(d=>d.ruta)).sort((a,b)=>String(a).localeCompare(String(b),'es',{numeric:true}))];
  const auditablesOpts=[{v:'TODOS',t:'Todos los clientes'},{v:'AUDITABLES',t:'Solo auditables'}];
  let avClass=''; if(FILTERS.segmento!=='TODOS'&&s.objetivo) avClass=clsByObj(FILTERS.segmento,s.avance);
  $('viewFilters').innerHTML=`
    <div class="card">
      <div class="header"><div class="logo">↗</div><div><div class="kicker">Mobile Pro</div><h1>Imperdonables</h1></div></div>
      <div class="grid2">
        <div class="kpi ${FILTERS.segmento!=='TODOS'?'obj':''}"><div class="label">Objetivo</div><div class="value">${s.objetivo?formatPct(s.objetivo):'NA'}</div></div>
        <div class="kpi ${avClass}"><div class="label">Avance</div><div class="value">${formatPct(s.avance)}</div></div>
        <div class="kpi"><div class="label">Clientes</div><div class="value">${s.totalClientes}</div></div>
        <div class="kpi"><div class="label">Auditables</div><div class="value">${s.totalAuditables}</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="section-title">Filtros principales</div>
      <label>1. Segmento</label><select id="seg">${segs.map(x=>`<option value="${esc(x)}" ${x===FILTERS.segmento?'selected':''}>${x==='TODOS'?'Todos los segmentos':esc(x)}</option>`).join('')}</select>
      <label>2. Jefe</label><select id="jefe">${jefes.map(x=>`<option value="${esc(x)}" ${x===FILTERS.jefe?'selected':''}>${x==='TODOS'?'Todos los jefes':esc(x)}</option>`).join('')}</select>
      <label>3. Ruta</label><select id="ruta">${rutas.map(x=>`<option value="${esc(x)}" ${x===FILTERS.ruta?'selected':''}>${x==='TODOS'?'Todas las rutas':esc(x)}</option>`).join('')}</select>
      <label>4. Auditables</label><select id="auditables">${auditablesOpts.map(x=>`<option value="${x.v}" ${x.v===FILTERS.auditables?'selected':''}>${x.t}</option>`).join('')}</select>
      <div class="actions"><button id="go" ${isLoading||s.totalClientes===0?'disabled':''}>${isLoading?'Cargando...':'Ver clientes'}</button><button id="reload" class="secondary" ${isLoading?'disabled':''}>Recargar Data</button></div>
    </div>
    <div class="card help" style="margin-top:12px"><div><b>Filtra para comenzar</b><br><br>Selecciona segmento, jefe y ruta para revisar clientes e imperdonables.</div></div>`;
  $('seg').onchange=e=>{FILTERS={...FILTERS,segmento:e.target.value,jefe:'TODOS',ruta:'TODOS'};renderFilters();};
  $('jefe').onchange=e=>{FILTERS={...FILTERS,jefe:e.target.value,ruta:'TODOS'};renderFilters();};
  $('ruta').onchange=e=>{FILTERS={...FILTERS,ruta:e.target.value};renderFilters();};
  $('auditables').onchange=e=>{FILTERS={...FILTERS,auditables:e.target.value};renderFilters();};
  $('go').onclick=renderResults;
  $('reload').onclick=init;
}
function renderResults(){
  showView('viewResults');
  let arr=filteredData().sort((a,b)=>String(a.ruta)!==String(b.ruta)?String(a.ruta).localeCompare(String(b.ruta),'es',{numeric:true}):String(a.cliente).localeCompare(String(b.cliente),'es'));
  const audit=arr.filter(x=>x.auditable).length;
  $('viewResults').innerHTML=`<div class="topbar"><div><h2>${FILTERS.ruta!=='TODOS'?'Ruta '+esc(FILTERS.ruta):'Clientes filtrados'}</h2><div class="meta">${arr.length} clientes · ${audit} auditables</div></div><button class="back" id="back">Volver</button></div><input class="search" id="q" placeholder="Buscar por cliente o número..."><div class="scroll" id="list"></div>`;
  $('back').onclick=()=>renderFilters();
  $('q').oninput=()=>drawList(arr);
  drawList(arr);
}
function drawList(arr){
  const q=upper($('q')?.value||'');
  const list=arr.filter(d=>!q||upper(d.cliente).includes(q)||upper(d.outnum).includes(q));
  $('list').innerHTML = list.length ? list.map((d,i)=>`<div class="row" data-i="${i}"><div class="client-title">${esc(d.cliente)}</div><div class="meta">Outnum ${esc(d.outnum)} · ${esc(d.segmento)} · Ruta ${esc(d.ruta||'-')} · Jefe ${esc(d.jefe||'-')}</div><div class="tags"><span class="tag ${clsByObj(d.segmento,d.porcentaje)}">Avance ${formatPct(d.porcentaje)}</span><span class="tag">OK ${d.cumplidos}/${d.totalImperdonables}</span><span class="tag ${iceClass(d.ice)}">ICE ${d.ice===null?'S/D':formatPct(d.ice)}</span>${d.auditable?'<span class="tag audit">Auditable</span>':''}</div><div class="bar"><div class="${barByObj(d.segmento,d.porcentaje)}" style="width:${Math.min(d.porcentaje,100)}%"></div></div></div>`).join('') : `<div class="card help"><b>No hay clientes con esos filtros.</b></div>`;
  [...$('list').querySelectorAll('.row')].forEach((el,idx)=>el.onclick=()=>{SELECTED=list[idx]; renderDetail();});
}
function renderDetail(){
  const c=SELECTED; if(!c) return renderResults();
  showView('viewDetail');
  const objetivo=CONFIG.objetivosSegmento[c.segmento]||0, pendientes=Math.max(c.totalImperdonables-c.cumplidos,0);
  $('viewDetail').innerHTML=`<div class="topbar"><div><h2>Detalle del cliente</h2><div class="meta">Imperdonables y avance</div></div><button class="back" id="back2">Volver</button></div><div class="scroll"><div class="card detail-main">${c.auditable?'<div class="audit-corner"><span class="tag audit">Auditable</span></div>':''}<div class="kicker">${esc(c.segmento)} · ${esc(c.cedi||'-')} · Ruta ${esc(c.ruta||'-')}</div><div class="big">${esc(c.cliente||'-')}</div><div class="meta">Outnum ${esc(c.outnum||'-')}</div><div class="meta">Jefe: ${esc(c.jefe||'-')}</div><div class="split"><div><div class="smalllabel">Avance actual</div><div class="bigvalue">${formatPct(c.porcentaje)}</div></div><div style="text-align:right"><div class="smalllabel">Objetivo segmento</div><div class="bigvalue">${formatPct(objetivo)}</div></div></div><div class="tags"><span class="tag ${iceClass(c.ice)}">ICE del cliente: ${c.ice===null?'Sin dato':formatPct(c.ice)}</span></div><div class="info"><b>Detalle:</b> ${esc(c.detalle||'-')}<br><b>Territorio:</b> ${esc(c.territorio||'-')}<br><b>Cedi:</b> ${esc(c.cedi||'-')}</div><div class="triple"><div><div class="smalllabel">Total</div><div class="bigvalue">${c.totalImperdonables}</div></div><div><div class="smalllabel">OK</div><div class="bigvalue" style="color:#34d399">${c.cumplidos}</div></div><div><div class="smalllabel">Pend.</div><div class="bigvalue" style="color:#fb7185">${pendientes}</div></div></div><div style="margin-top:16px"><div class="meta"><b>Progreso general</b> <span style="float:right">${c.cumplidos}/${c.totalImperdonables}</span></div><div class="bar"><div class="${barByObj(c.segmento,c.porcentaje)}" style="width:${Math.min(c.porcentaje,100)}%"></div></div></div></div><div class="card" style="margin-top:12px"><div class="section-title">Imperdonables</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px"><button type="button" onclick="filtrarImp('todos')" style="height:40px">Todos</button><button type="button" onclick="filtrarImp('ok')" style="height:40px;background:#10b981">Cumplidos</button><button type="button" onclick="filtrarImp('no')" style="height:40px;background:#f43f5e">Faltantes</button></div><div id="listaImperdonables">${c.imperdonables.length?c.imperdonables.map(imp=>`<div class="imp ${imp.cumplido?'ok':'no'} itemImp" data-status="${imp.cumplido?'ok':'no'}"><div class="dot" style="background:${imp.cumplido?'#10b981':'#f43f5e'}"></div><div style="flex:1"><b>${esc(imp.nombre)}</b><div class="meta">Valor: ${esc(imp.rawVal||'-')}</div></div><span class="tag ${imp.cumplido?'ok':'bad'}">${imp.cumplido?'Cumplido':'Pendiente'}</span></div>`).join(''):'<div class="muted">Sin imperdonables activos</div>'}</div></div></div>`;
  $('back2').onclick=renderResults;
}
function filtrarImp(tipo){document.querySelectorAll('.itemImp').forEach(el=>{const estado=el.dataset.status; el.style.display=(tipo==='todos'||estado===tipo)?'flex':'none';});}
function showView(id){['viewFilters','viewResults','viewDetail'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
async function init(){renderFilters(true); try{await loadAllData(); renderFilters(false); if(!DATA.length) showError('No se cargaron datos. Revisá que las hojas estén publicadas como CSV.');}catch(e){console.error(e); showError('Error cargando la aplicación.'); renderFilters(false);}}
init();
</script>
</body>
</html>
